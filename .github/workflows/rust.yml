name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-lint-

    - name: Check Rust formatting
      run: cargo fmt --check

    # --locked: build against the committed Cargo.lock and FAIL if it would
    # need to change, keeping CI reproducible.
    # The stdsimd feature is nightly-only and intentionally not linted here.
    - name: Clippy (default features)
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Clippy (simdeez_f)
      run: cargo clippy --locked --all-targets --features simdeez_f -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.95.0

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Test (default features)
      run: cargo test --locked

    # The SIMD implementations and their tests are x86_64-gated; this runner
    # is x86_64 so they execute here.
    - name: Test (simdeez_f)
      run: cargo test --locked --features simdeez_f
